<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g2)"/>

  <!-- Perspective Factory Floor Lines -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5">
    <line x1="300" y1="120" x2="0" y2="400"/>
    <line x1="300" y1="120" x2="120" y2="400"/>
    <line x1="300" y1="120" x2="240" y2="400"/>
    <line x1="300" y1="120" x2="360" y2="400"/>
    <line x1="300" y1="120" x2="480" y2="400"/>
    <line x1="300" y1="120" x2="600" y2="400"/>
    <!-- Safety Corridor Markings -->
    <line x1="260" y1="400" x2="300" y2="150" stroke="#f59e0b" stroke-dasharray="6 6"/>
    <line x1="340" y1="400" x2="300" y2="150" stroke="#f59e0b" stroke-dasharray="6 6"/>
  </g>

  <!-- Industrial Facility Hall Truss Framework -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M 80,180 L 300,90 L 520,180"/>
    <path d="M 80,220 L 300,130 L 520,220"/>
    <line x1="160" y1="148" x2="160" y2="280"/>
    <line x1="440" y1="148" x2="440" y2="280"/>
    <!-- Overhead Gantry Crane Indicator -->
    <rect x="180" y="110" width="240" height="16" fill="rgba(37, 99, 235, 0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  </g>

  <!-- Inspection Target HUD -->
  <g transform="translate(300, 240)">
    <circle r="22" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
    <circle r="4" fill="#10b981"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#10b981" stroke-width="1"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#10b981" stroke-width="1"/>
  </g>

  <rect x="30" y="330" width="230" height="40" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.15)"/>
  <text x="44" y="348" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="700">PLANT VISIT RECORD #PV-019</text>
  <text x="44" y="362" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Floor Layout &amp; Safety Verification</text>

  <rect x="420" y="30" width="150" height="26" rx="4" fill="rgba(30, 58, 138, 0.4)" stroke="#3b82f6"/>
  <text x="432" y="47" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="600">PHOTO PLACEHOLDER</text>
</svg>
