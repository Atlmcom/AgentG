<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g1)"/>
  
  <!-- Architectural / Industrial Schematic Grid -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
  </g>

  <!-- Industrial Machinery / CNC Center Schematic Vector -->
  <g transform="translate(160, 90)" stroke="#60a5fa" stroke-width="2" fill="none">
    <rect x="20" y="30" width="240" height="150" rx="8" stroke-dasharray="8 4"/>
    <rect x="50" y="60" width="180" height="90" fill="rgba(37, 99, 235, 0.15)"/>
    <!-- Spindle & Axis Assembly -->
    <line x1="140" y1="60" x2="140" y2="115" stroke-width="3" stroke="#38bdf8"/>
    <circle cx="140" cy="120" r="10" stroke-width="2" fill="#1e40af"/>
    <!-- Machine Bed -->
    <rect x="70" y="140" width="140" height="15" fill="#334155"/>
    <!-- Dimension Arrows -->
    <line x1="270" y1="30" x2="270" y2="180" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 267,35 L 270,30 L 273,35 M 267,175 L 270,180 L 273,175" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Blueprint HUD Callouts -->
  <rect x="30" y="330" width="220" height="40" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.15)"/>
  <text x="44" y="348" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="700">FACILITY RECORD #V-042</text>
  <text x="44" y="362" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Precision Machining &amp; CNC Setup</text>

  <rect x="420" y="30" width="150" height="26" rx="4" fill="rgba(30, 58, 138, 0.4)" stroke="#3b82f6"/>
  <text x="432" y="47" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="600">PHOTO PLACEHOLDER</text>
</svg>
