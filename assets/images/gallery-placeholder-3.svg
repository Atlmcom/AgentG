<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g3)"/>

  <!-- Conference Table & Blueprint Review Schematic -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1">
    <circle cx="300" cy="200" r="160" fill="none"/>
    <circle cx="300" cy="200" r="120" fill="none" stroke-dasharray="4 4"/>
  </g>

  <!-- Technical Spec Document on Desk -->
  <g transform="translate(200, 120)">
    <rect x="0" y="0" width="200" height="140" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="20" y1="25" x2="120" y2="25" stroke="#93c5fd" stroke-width="2"/>
    <line x1="20" y1="45" x2="180" y2="45" stroke="#64748b" stroke-width="1.5"/>
    <line x1="20" y1="60" x2="160" y2="60" stroke="#64748b" stroke-width="1.5"/>
    <line x1="20" y1="75" x2="175" y2="75" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Checklist Stamp -->
    <rect x="120" y="90" width="60" height="30" rx="4" fill="rgba(5, 150, 105, 0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="130" y="110" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700">VERIFIED</text>
  </g>

  <!-- Meeting Participants Indicators -->
  <g fill="#3b82f6" opacity="0.8">
    <circle cx="160" cy="190" r="14"/> <!-- GroundAgent Representative -->
    <circle cx="440" cy="190" r="14" fill="#64748b"/> <!-- Supplier Management -->
  </g>
  <text x="160" y="225" text-anchor="middle" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="600">GROUNDAGENT</text>
  <text x="440" y="225" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">SUPPLIER</text>

  <rect x="30" y="330" width="240" height="40" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.15)"/>
  <text x="44" y="348" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="700">MEETING RECORD #SM-031</text>
  <text x="44" y="362" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Buyer Requirements Review with Leadership</text>

  <rect x="420" y="30" width="150" height="26" rx="4" fill="rgba(30, 58, 138, 0.4)" stroke="#3b82f6"/>
  <text x="432" y="47" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="600">PHOTO PLACEHOLDER</text>
</svg>
